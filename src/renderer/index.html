<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Architect Companion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- ============ FIXED CHROME (header + tabs) ============ -->
      <div class="chrome">
        <header class="app-header">
          <div class="app-icon" id="appIcon">
            <img src="assets/icon.svg" alt="Architect Companion" width="44" height="44" draggable="false" />
          </div>
          <div class="app-meta">
            <h1>Architect Companion</h1>
            <p>Auto-update Architect Engagements daily</p>
            <p class="app-session" id="appSession">
              <span id="authConnected" hidden>Connected as: <strong id="authUsername"></strong> <button class="btn-signout" id="signOutBtn">Sign out</button></span>
              <button class="btn-signout" id="signInBtn" hidden>Sign in to Salesforce</button>
            </p>
          </div>
          <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" title="Toggle light/dark theme">
              <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
                <circle cx="8" cy="8" r="3"/>
                <line x1="8" y1="1" x2="8" y2="2.5"/><line x1="8" y1="13.5" x2="8" y2="15"/>
                <line x1="1" y1="8" x2="2.5" y2="8"/><line x1="13.5" y1="8" x2="15" y2="8"/>
                <line x1="3.05" y1="3.05" x2="4.12" y2="4.12"/><line x1="11.88" y1="11.88" x2="12.95" y2="12.95"/>
                <line x1="12.95" y1="3.05" x2="11.88" y2="4.12"/><line x1="4.12" y1="11.88" x2="3.05" y2="12.95"/>
              </svg>
              <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
                <path d="M13.5 10A6 6 0 1 1 6 2.5a4.5 4.5 0 0 0 7.5 7.5z"/>
              </svg>
            </button>
            <button class="pill" id="startupToggle">
              <span class="pill-dot"></span>
              <span class="pill-label">Launch on Startup</span>
            </button>
            <button class="pill" id="activeToggle">
              <span class="pill-dot"></span>
              <span class="pill-label">Active</span>
            </button>
          </div>
        </header>

        <nav class="tabs">
          <button class="tab active" data-tab="engagements">Engagements</button>
          <button class="tab" data-tab="logs">Logs</button>
          <button class="tab" data-tab="about">About</button>
        </nav>
      </div>

      <!-- ============ SCROLLABLE CONTENT ============ -->
      <main class="content">
        <!-- TAB 1: Engagements -->
        <section class="tab-panel active" data-panel="engagements">
          <div class="eng-toolbar">
            <span class="eng-count" id="engCount"></span>
            <button class="btn-refresh" id="refreshEngBtn">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                <path d="M13.5 8A5.5 5.5 0 1 1 10 3.07"/>
                <polyline points="10 1 10 4 13 4"/>
              </svg>
              Refresh
            </button>
          </div>
          <div class="eng-search-wrap">
            <svg class="eng-search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <circle cx="6.5" cy="6.5" r="5"/>
              <line x1="10.5" y1="10.5" x2="14" y2="14"/>
            </svg>
            <input class="eng-search" id="engSearch" type="text" placeholder="Search by name or title…" autocomplete="off" spellcheck="false"/>
            <button class="eng-search-clear" id="engSearchClear" hidden>✕</button>
          </div>
          <div class="eng-list" id="engList">
            <div class="eng-empty">Loading…</div>
          </div>
        </section>

        <!-- TAB 2: Logs -->
        <section class="tab-panel" data-panel="logs">
          <div class="card">
            <div class="row logs-header">
              <label class="row-label">EXECUTION HISTORY</label>
              <div class="logs-header-controls">
                <select id="logRange" class="log-range">
                  <option value="last-run">Last run</option>
                  <option value="3d" selected>Last 3 days</option>
                  <option value="7d">Last 7 days</option>
                  <option value="15d">Last 15 days</option>
                  <option value="30d">Last 30 days</option>
                </select>
                <button id="clearLogs" class="btn btn-danger-ghost btn-sm">Clear</button>
              </div>
            </div>

            <div class="logs" id="logs">
              <div class="logs-empty">No logs yet.</div>
            </div>
          </div>
        </section>

        <!-- TAB 3: About -->
        <section class="tab-panel" data-panel="about">
          <div class="card">
            <h2 class="section-title">About</h2>
            <div class="config-row"><span>Application:</span><code>Architect Companion</code></div>
            <div class="config-row"><span>Version:</span><code>0.1.4</code></div>
            <div class="config-row"><span>Description:</span><code>Auto-updates Architect Engagements in Salesforce</code></div>
          </div>

          <div class="card">
            <h2 class="section-title">Files</h2>
            <div class="file-row">
              <span class="file-row-label">Config file:</span>
              <div class="file-path-wrap">
                <code id="aboutConfigPath">…</code>
                <button class="btn-copy-path" id="copyConfigPath" title="Copy path">
                  <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="13" height="13">
                    <rect x="5" y="5" width="8" height="8" rx="1.5"/>
                    <path d="M3 9H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v1"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="file-row">
              <span class="file-row-label">Log file:</span>
              <div class="file-path-wrap">
                <code id="aboutLogPath">…</code>
                <button class="btn-copy-path" id="copyLogPath" title="Copy path">
                  <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="13" height="13">
                    <rect x="5" y="5" width="8" height="8" rx="1.5"/>
                    <path d="M3 9H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v1"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- ============ STICKY FOOTER (all tabs) ============ -->
      <footer class="sticky-footer">
        <div class="footer-meta">
          <div class="footer-label">Daily Schedule</div>
          <div class="footer-next-run" id="nextRun"></div>
        </div>
        <div class="footer-controls">
          <input type="time" id="timeInput" class="time-input" />
          <button class="btn-run-now" id="runNowBtn">
            <svg viewBox="0 0 12 14" fill="currentColor" width="11" height="13"><path d="M1 1l10 6-10 6V1z"/></svg>
            Run Now
          </button>
        </div>
      </footer>

      <div class="toast" id="toast"></div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
